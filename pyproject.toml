[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dream-exe"
version = "0.1.0"
description = "Reproducible video-to-trajectory and execution research pipeline."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10,<3.11"
authors = [
    { name = "Rui Zhao" },
    { name = "Kaiming Yang" },
    { name = "Jifeng Zhu" },
    { name = "Siyang Chen" },
    { name = "Ziqi Wang" },
    { name = "Weijia Wu" },
    { name = "Kevin Qinghong Lin" },
    { name = "Heng Wang" },
    { name = "Mike Zheng Shou" },
]
keywords = [
    "robot manipulation",
    "video generation",
    "video-to-trajectory",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.scripts]
dream-exe = "dream_exe.cli:main"

[project.optional-dependencies]
assets = [
    "gdown>=5,<6",
    "huggingface-hub>=0.34,<1",
]
vda-runtime = [
    "easydict>=1.13,<2",
    "einops>=0.8,<1",
    "opencv-python-headless>=4.8",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "tqdm>=4.66,<5",
]
dvd-runtime = [
    "accelerate>=1.9,<2",
    "diffusers>=0.36,<0.38",
    "einops>=0.8,<1",
    "huggingface-hub>=0.34,<1",
    "imageio>=2.31,<3",
    "imageio-ffmpeg>=0.4,<1",
    "matplotlib>=3.10,<3.11",
    "modelscope>=1.25,<2",
    "omegaconf>=2.3,<3",
    "pandas>=2.3,<2.4",
    "peft>=0.18,<0.20",
    "pillow>=10,<13",
    "protobuf>=5,<7",
    "safetensors>=0.5,<1",
    "sentencepiece>=0.2,<1",
    "tabulate>=0.9,<1",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "tqdm>=4.66,<5",
    "transformers>=4.57,<4.58",
    "typing-extensions>=4.10,<5",
]
tracking-runtime = [
    "imageio>=2.31,<3",
    "matplotlib>=3.10,<3.11",
    "pillow>=10,<13",
    "torch==2.7.1",
    "torchvision==0.22.1",
]
region-runtime = [
    "addict==2.4.0",
    "easydict>=1.13,<2",
    "hydra-core>=1.3,<1.4",
    "iopath>=0.1.10,<0.2",
    "matplotlib>=3.10,<3.11",
    "opencv-python-headless==4.11.0.86",
    "pillow>=10,<13",
    "pycocotools>=2.0.8,<3",
    "timm==0.9.7",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "tqdm>=4.66,<5",
    "transformers>=4.57,<4.58",
    "yapf==0.40.1",
]
wan22-runtime = [
    "accelerate>=1.1,<2",
    "dashscope>=1.26,<2",
    "diffusers>=0.31,<0.38",
    "easydict>=1.13,<2",
    "flash-attn==2.8.3",
    "ftfy>=6.3,<7",
    "imageio>=2.31,<3",
    "imageio-ffmpeg>=0.4,<1",
    "librosa>=0.10,<0.12",
    "numpy>=1.23.5,<2",
    "opencv-python-headless>=4.9",
    "pillow>=10,<13",
    "tokenizers>=0.20.3,<0.22",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "tqdm>=4.66,<5",
    "transformers>=4.49,<=4.51.3",
]
video = [
    "decord>=0.6",
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4",
    "matplotlib>=3.7",
    "opencv-python-headless>=4.8",
    "pillow>=10",
]
sim = [
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4,<1",
    "mujoco==3.3.1",
    "numba==0.62.1",
    "opencv-python-headless==4.11.0.86",
    "robosuite==1.5.2",
    "scipy==1.15.3",
    "trimesh>=4,<5",
]
robocasa-runtime = [
    "gymnasium==0.29.1",
    "lxml>=5,<7",
    "PyYAML>=6,<7",
]
vlm = [
    "openai>=2,<3",
]

[project.urls]
Homepage = "https://github.com/showlab/Dream.exe"
Paper = "https://arxiv.org/abs/2606.04811"
Repository = "https://github.com/showlab/Dream.exe"

[tool.setuptools.package-data]
"dream_exe.video2traj" = ["configs/*.json"]
"dream_exe.model_assets" = ["configs/*.json", "configs/*.yaml"]

[tool.setuptools.data-files]
"configs" = [
    "configs/README.md",
    "configs/credentials.template.json",
    "configs/workspace.json",
]
"integrations" = [
    "integrations/download_checkpoints.sh",
    "integrations/README.md",
    "integrations/setup.py",
    "integrations/setup_dependencies.sh",
    "integrations/sources.json",
]
"integrations/requirements" = [
    "integrations/requirements/sam2.txt",
    "integrations/requirements/wan22-flash-attn.txt",
]
"integrations/patches/dvd" = [
    "integrations/patches/dvd/0001-local-wan-bundle.patch",
    "integrations/patches/dvd/README.md",
    "integrations/patches/dvd/manifest.json",
]
"integrations/patches/grounding_dino" = [
    "integrations/patches/grounding_dino/0001-torch-2.7-scalar-type.patch",
    "integrations/patches/grounding_dino/README.md",
    "integrations/patches/grounding_dino/manifest.json",
]
"integrations/patches/robocasa" = [
    "integrations/patches/robocasa/0001-task-success-semantics.patch",
    "integrations/patches/robocasa/0002-runtime-compatibility.patch",
    "integrations/patches/robocasa/README.md",
    "integrations/patches/robocasa/manifest.json",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dream_exe*"]

[tool.uv]
conflicts = [
    [
        { extra = "dvd-runtime" },
        { extra = "wan22-runtime" },
    ],
    [
        { extra = "region-runtime" },
        { extra = "wan22-runtime" },
    ],
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Keep the release lint contract stable across Ruff minor releases.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
